<style>
:root {
  --night: #0d0f25; --indigo: #231d40; --plum: #3d1534; --maroon: #4e0b21;
  --gold: #d8aa52; --gold-hi: #fbe9b0; --gold-lo: #8d6219; --gold-soft: #e8c68a;
  --ivory: #faf0e0; --ivory-dim: rgba(250, 240, 224, 0.74); --line: rgba(216, 170, 82, 0.5);
  --petal-a: #c4174f; --petal-b: #e2477d;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --night: #0d0f25; --indigo: #231d40; --plum: #3d1534; --maroon: #4e0b21;
    --gold: #d8aa52; --gold-hi: #fbe9b0; --gold-lo: #8d6219; --gold-soft: #e8c68a;
    --ivory: #faf0e0; --ivory-dim: rgba(250, 240, 224, 0.74); --line: rgba(216, 170, 82, 0.5);
  }
}
:root[data-theme="dark"] {
  --night: #0d0f25; --indigo: #231d40; --plum: #3d1534; --maroon: #4e0b21;
  --gold: #d8aa52; --gold-hi: #fbe9b0; --gold-lo: #8d6219; --gold-soft: #e8c68a;
  --ivory: #faf0e0; --ivory-dim: rgba(250, 240, 224, 0.74); --line: rgba(216, 170, 82, 0.5);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
html { background: var(--night); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  position: relative; z-index: 0; margin: 0; overflow: hidden; color: var(--ivory); background: var(--night);
  font-family: 'Lora', Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
.sky { position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(110% 55% at 50% 108%, rgba(242, 140, 78, 0.2), transparent 62%),
              linear-gradient(180deg, var(--night) 0%, var(--indigo) 36%, var(--plum) 70%, var(--maroon) 100%); }
.petals { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.petal { position: absolute; top: -6vh; width: 13px; height: 9px; opacity: 0.8; border-radius: 80% 0 80% 0;
  background: linear-gradient(135deg, var(--petal-b), var(--petal-a)); animation: fall linear infinite; }
@keyframes fall { to { transform: translate3d(var(--drift, 40px), 112vh, 0) rotate(560deg); } }

/* one panel per swipe */
.deck { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.screen { position: relative; height: 100%; min-height: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px 20px 26px; overflow: hidden; }
.inner { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }

/* opening panel */
.lights { position: absolute; inset: 0 0 auto; height: 210px; pointer-events: none; }
.lights svg { width: 100%; height: 100%; display: block; }
.bulb { animation: twinkle var(--tw, 2.6s) ease-in-out infinite; animation-delay: var(--td, 0s); }
@keyframes twinkle { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
.mandala { position: absolute; left: 50%; top: 54%; width: min(125vw, 640px); aspect-ratio: 1; translate: -50% -50%;
  opacity: 0.19; pointer-events: none; animation: spin 180s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.names { font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; font-weight: 500; font-size: 14px; letter-spacing: 0.42em;
  padding-left: 0.42em; color: var(--gold-soft); margin: 64px 0 12px; }
.title { font-style: italic; font-weight: 600; font-size: clamp(40px, 12vw, 64px); line-height: 1.08; margin: 0;
  background: linear-gradient(180deg, var(--gold-hi) 8%, var(--gold) 52%, var(--gold-lo) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 10px rgba(216, 170, 82, 0.28)); }
.orn { width: 200px; height: 22px; margin: 20px 0 16px; }
.lead { font-style: italic; font-weight: 500; font-size: 20px; margin: 0; }
.countdown { margin: 8px 0 0; color: var(--gold-soft); font-size: 16px; min-height: 1.55em; }
.cue { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font: inherit; font-size: 15px; color: var(--ivory-dim); background: none; border: 0; cursor: pointer; }
.cue svg { width: 22px; height: 22px; animation: bob 2.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

/* event panels */
.when-day { margin: 0; font-size: 15px; color: var(--gold-soft); letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.when-day svg { width: 20px; height: 20px; color: var(--gold); }
.ev-title { font-size: clamp(27px, 7.4vw, 34px); font-weight: 600; margin: 2px 0 0; line-height: 1.2; }
.ev-sub { margin: 2px 0 0; color: var(--ivory-dim); font-size: 16px; }
.frame { position: relative; margin-top: 14px; height: clamp(250px, calc(100svh - 360px), 620px); aspect-ratio: 9 / 16; max-width: 86vw;
  border-radius: 50% 50% 16px 16px / 14% 14% 16px 16px; padding: 6px;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 30px rgba(216, 170, 82, 0.18); }
.frame video { width: 100%; height: 100%; display: block; object-fit: cover; background: var(--night);
  border-radius: 50% 50% 11px 11px / 13.6% 13.6% 11px 11px; }
.play { position: absolute; inset: 6px; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; background: transparent;
  border-radius: 50% 50% 11px 11px / 13.6% 13.6% 11px 11px; }
.play span { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(13, 15, 37, 0.62); border: 1.5px solid var(--gold-hi); box-shadow: 0 0 24px rgba(216, 170, 82, 0.35); }
.play svg { width: 28px; height: 28px; margin-left: 4px; color: var(--gold-hi); }
.play[hidden] { display: none; }
.addr { margin: 12px 0 0; max-width: 24rem; font-size: 14.5px; line-height: 1.5; color: var(--ivory-dim); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 360px; margin-top: 14px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15.5px; font-weight: 500;
  min-height: 46px; border-radius: 999px; padding: 0 14px; color: #23130a; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 72%);
  border: 1px solid var(--gold); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.quiet { color: var(--ivory); background: rgba(13, 15, 37, 0.35); border-color: var(--line); }

/* our photo, faint behind everything */
.bgphoto { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.1;
  background: url("hands.jpg") center 45% / cover no-repeat; }

/* closing panel */
.bless { font-style: italic; font-size: 21px; margin: 0; max-width: 22rem; }
.from { margin: 26px 0 0; color: var(--ivory-dim); }
.family { font-style: italic; font-weight: 600; font-size: clamp(28px, 8vw, 34px); margin: 2px 0 0;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.again { margin-top: 34px; font: inherit; font-size: 15px; color: var(--ivory); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 20px; cursor: pointer; }

/* progress dots */
.dots { position: fixed; right: 10px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 1px solid var(--gold-soft); background: transparent; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--gold-hi); border-color: var(--gold-hi); box-shadow: 0 0 8px rgba(251, 233, 176, 0.7); }

:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 3px; }
@media (max-height: 640px) { .names { margin-top: 40px; } .addr { display: none; } }
@media (prefers-reduced-motion: reduce) { .bulb, .mandala, .petal, .cue svg { animation: none !important; } .petals { display: none; } .deck { scroll-behavior: auto; } }
</style>
</head>

      <p class="countdown" id="countdown"></p>

    <button class="cue" type="button" id="cue">Swipe up
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9 L12 15 L18 9"/></svg>

      <p class="from">With love and warm regards,</p>
      <p class="family">Sharma &amp; Rai Family</p>
      <button class="again" type="button" id="again">Back to the top</button>
    </div>
  </section>
</div>

  { key: 'wedding', title: 'Wedding Ceremony', day: 'Wednesday, 9 December 2026', sub: 'From 6:30 PM at Occassion Plus Banquet',
    start: '2026-12-09T18:30:00+05:30', gcal: ['20261209T130000Z', '20261209T180000Z'], venue: 'Occassion Plus Banquet',
    addr: '4th Floor, Little World Mall, Sector 2, Plot No. 21, Kharghar, Navi Mumbai – 410210',
    maps: 'Occassion Plus Banquet, Little World Mall, Sector 2, Kharghar, Navi Mumbai 410210' }
];
const WORDS = { 1: 'Join us for a special evening', 2: 'Join us for two special evenings', 3: 'Join us for three special evenings' };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const deck = document.getElementById('deck');

function visibleKeys() {
  const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).toLowerCase();
  const keys = h.split('-').filter(k => EVENTS.some(e => e.key === k));
  return keys.length ? EVENTS.filter(e => keys.includes(e.key)).map(e => e.key) : EVENTS.map(e => e.key);
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const gcal = e => 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE',
  text: e.title + ' – Alok & Madhu', dates: e.gcal.join('/'), location: e.venue + ', ' + e.addr, details: 'With love and warm regards, Sharma & Rai Family' });
const maps = e => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.maps);
const go = el => el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });

let observer;
function render() {
  const list = EVENTS.filter(e => visibleKeys().includes(e.key));
  document.getElementById('lead').textContent = WORDS[list.length];
  document.getElementById('events').innerHTML = list.map(e => `
    <section class="screen" id="s-${e.key}" aria-labelledby="t-${e.key}">
      <div class="inner">
        <p class="when-day">${ICON[e.key]}${esc(e.day)}</p>
        <h2 class="ev-title" id="t-${e.key}">${esc(e.title)}</h2>
        <p class="ev-sub">${esc(e.sub)}</p>
        <div class="frame">
          <video playsinline preload="none" poster="${POSTER[e.key]}" aria-label="${esc(e.title)} invitation video">${VIDEO[e.key] ? `<source src="${VIDEO[e.key]}" type="video/mp4">` : ''}</video>
          <button class="play" type="button" aria-label="Play the ${esc(e.title)} invitation"><span>${PLAY}</span></button>
        </div>
        <p class="addr">${esc(e.addr)}</p>
        <div class="actions">
          <a class="btn" href="${maps(e)}" target="_blank" rel="noopener">${PIN}Directions</a>
          <a class="btn quiet" href="${gcal(e)}" target="_blank" rel="noopener">${CAL}Add to calendar</a>
        </div>
      </div>
    </section>`).join('');
  document.querySelectorAll('.frame').forEach(f => {
    const v = f.querySelector('video'), b = f.querySelector('.play');
    b.addEventListener('click', () => { document.querySelectorAll('video').forEach(o => { if (o !== v) o.pause(); }); v.controls = true; v.play().catch(() => {}); });
    v.addEventListener('play', () => { b.hidden = true; });
    v.addEventListener('ended', () => { b.hidden = false; v.controls = false; v.load(); });
  });
  const screens = [...document.querySelectorAll('.screen')];
  const dots = document.getElementById('dots');
  dots.innerHTML = screens.map((s, i) => `<button type="button" aria-label="${esc(s.getAttribute('aria-label') || s.querySelector('h2')?.textContent || 'Section')}"${i ? '' : ' aria-current="true"'}></button>`).join('');
  [...dots.children].forEach((d, i) => d.addEventListener('click', () => go(screens[i])));
  if (observer) observer.disconnect();
  observer = new IntersectionObserver(entries => entries.forEach(en => {
    const i = screens.indexOf(en.target);
    if (en.isIntersecting && en.intersectionRatio > 0.6) [...dots.children].forEach((d, j) => d.setAttribute('aria-current', i === j ? 'true' : 'false'));
    if (!en.isIntersecting || en.intersectionRatio < 0.4) { const v = en.target.querySelector('video'); if (v && !v.paused) v.pause(); }
  }), { root: deck, threshold: [0.4, 0.6] });
  screens.forEach(s => observer.observe(s));
  countdown(list);
}
function countdown(list) {
  const el = document.getElementById('countdown');
  const next = list.map(e => new Date(e.start)).find(d => d.getTime() > Date.now());
  if (!next) { el.textContent = ''; return; }
  const ist = d => new Date(d.getTime() + 5.5 * 3600e3).toISOString().slice(0, 10);
  const days = Math.round((Date.parse(ist(next)) - Date.parse(ist(new Date()))) / 86400e3);
  el.textContent = days <= 0 ? 'Today!' : days === 1 ? 'Tomorrow!' : days + ' days to go';
}
document.getElementById('cue').addEventListener('click', () => { const s = document.querySelectorAll('.screen')[1]; if (s) go(s); });
document.getElementById('again').addEventListener('click', () => go(document.getElementById('s-open')));

(function lights() {
  const W = 1000, svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' 210'); svg.setAttribute('preserveAspectRatio', 'xMidYMin slice');
  svg.innerHTML = '<defs><radialGradient id="bg"><stop offset="0" stop-color="#fff6dc"/><stop offset="0.35" stop-color="#ffd98a" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient></defs>';
  const cat = (x0, y0, x1, y1, sag, t) => [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + sag * 4 * t * (1 - t)];
  let rnd = 7; const r = () => (rnd = (rnd * 9301 + 49297) % 233280) / 233280;
  [[36, 18, 110, 24], [110, 96, 108, 22]].forEach(([y0, y1, sag, nb]) => {
    let d = 'M';
    for (let i = 0; i <= 60; i++) { const [x, y] = cat(-20, y0, W + 20, y1, sag, i / 60); d += (i ? ' L' : '') + x.toFixed(1) + ' ' + y.toFixed(1); }
    svg.insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#5a4626" stroke-width="1.6"/>`);
    for (let i = 0; i < nb; i++) { const [x, y] = cat(-20, y0, W + 20, y1, sag, (i + 0.5) / nb);
      svg.insertAdjacentHTML('beforeend', `<g class="bulb" style="--tw:${(1.8 + r() * 2.2).toFixed(2)}s;--td:-${(r() * 3).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="url(#bg)"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#fff4d6"/></g>`); }
  });
  for (let k = 0; k < 16; k++) {
    const x = 30 + k * 62 + (r() - 0.5) * 14, t = (x + 20) / (W + 40), yTop = 36 + (18 - 36) * t + 110 * 4 * t * (1 - t), L = 40 + r() * 100;
    svg.insertAdjacentHTML('beforeend', `<line x1="${x.toFixed(1)}" y1="${yTop.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(yTop + L).toFixed(1)}" stroke="#4a3a20" stroke-width="1"/>`);
    for (let j = 1; j <= Math.floor(L / 26); j++) { const yy = yTop + j * 26;
      svg.insertAdjacentHTML('beforeend', `<g class="bulb" style="--tw:${(2 + r() * 2.4).toFixed(2)}s;--td:-${(r() * 3).toFixed(2)}s"><circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="8" fill="url(#bg)"/><circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="1.8" fill="#fff4d6"/></g>`); }
  }
  document.getElementById('lights').appendChild(svg);
})();
(function mandala() {
  let s = '<g fill="none" stroke="#e8c68a" stroke-width="2">';
  [292, 228, 150, 74].forEach(rr => s += `<circle r="${rr}"/>`);
  for (let i = 0; i < 24; i++) s += `<path transform="rotate(${i * 15})" d="M0 -230 C 26 -250, 26 -276, 0 -290 C -26 -276, -26 -250, 0 -230 Z"/>`;
  for (let i = 0; i < 16; i++) s += `<path transform="rotate(${i * 22.5})" d="M0 -152 C 34 -170, 30 -206, 0 -226 C -30 -206, -34 -170, 0 -152 Z"/>`;
  for (let i = 0; i < 12; i++) s += `<path transform="rotate(${i * 30 + 15})" d="M0 -76 C 22 -92, 20 -126, 0 -148 C -20 -126, -22 -92, 0 -76 Z"/>`;
  s += '</g><g fill="#e8c68a">';
  for (let i = 0; i < 48; i++) { const a = i * 7.5 * Math.PI / 180; s += `<circle cx="${(260 * Math.sin(a)).toFixed(1)}" cy="${(-260 * Math.cos(a)).toFixed(1)}" r="3"/>`; }
  document.getElementById('mandala').innerHTML = s + '</g>';
})();
(function petals() {
  if (reduce) return;
  const box = document.getElementById('petals');
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('i'); p.className = 'petal'; const sc = 0.7 + Math.random() * 0.7;
    Object.assign(p.style, { left: (Math.random() * 100).toFixed(1) + 'vw', animationDuration: (11 + Math.random() * 9).toFixed(1) + 's',
      animationDelay: '-' + (Math.random() * 18).toFixed(1) + 's', width: (13 * sc).toFixed(1) + 'px', height: (9 * sc).toFixed(1) + 'px' });
    p.style.setProperty('--drift', ((Math.random() - 0.5) * 140).toFixed(0) + 'px'); box.appendChild(p);
  }
})();
render();
addEventListener('hashchange', render);
</script>
